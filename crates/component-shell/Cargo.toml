[package]
name = "gpui-component-shell"
description = "gpui-neath bindings for the gpui-shell runtime."
version = "0.6.5"
publish = false
edition.workspace = true

[lib]
name = "gpui_component_shell"
path = "src/lib.rs"

[dependencies]
gpui-shell.workspace = true
gpui-neath = { workspace = true, features = ["tree-sitter-rust"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-base = { workspace = true, features = ["test-support"] }
gpui-neath = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
