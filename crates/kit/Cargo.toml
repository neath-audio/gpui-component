[package]
name = "gpui-kit"
version = "0.7.0"
description = "GPUI Kit: one dependency for building desktop applications with GPUI, GPUI Base, GPUI Component and default assets."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
publish = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["component", "assets"]
# The styled component library, `gpui_kit::component`. Initializes `gpui-base` too.
component = ["dep:gpui-neath"]
# The default icon set for `gpui-neath`, `gpui_kit::assets`.
assets = ["dep:gpui-component-assets"]
# GPUI's test harness, native-platform rendering, and Kit UI test helpers.
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui-base/test-support", "gpui-neath?/test-support"]
# Frame-event instrumentation remains opt-in for performance builds.
profiler = ["gpui/profiler"]
inspector = ["gpui/inspector", "gpui-base/inspector", "gpui-neath?/inspector"]
decimal = ["component", "gpui-neath/decimal"]
tree-sitter = ["component", "gpui-neath/tree-sitter"]
tree-sitter-languages = ["component", "gpui-neath/tree-sitter-languages"]
tree-sitter-astro = ["component", "gpui-neath/tree-sitter-astro"]
tree-sitter-bash = ["component", "gpui-neath/tree-sitter-bash"]
tree-sitter-c = ["component", "gpui-neath/tree-sitter-c"]
tree-sitter-cmake = ["component", "gpui-neath/tree-sitter-cmake"]
tree-sitter-cpp = ["component", "gpui-neath/tree-sitter-cpp"]
tree-sitter-csharp = ["component", "gpui-neath/tree-sitter-csharp"]
tree-sitter-css = ["component", "gpui-neath/tree-sitter-css"]
tree-sitter-diff = ["component", "gpui-neath/tree-sitter-diff"]
tree-sitter-ejs = ["component", "gpui-neath/tree-sitter-ejs"]
tree-sitter-elixir = ["component", "gpui-neath/tree-sitter-elixir"]
tree-sitter-erb = ["component", "gpui-neath/tree-sitter-erb"]
tree-sitter-go = ["component", "gpui-neath/tree-sitter-go"]
tree-sitter-graphql = ["component", "gpui-neath/tree-sitter-graphql"]
tree-sitter-html = ["component", "gpui-neath/tree-sitter-html"]
tree-sitter-java = ["component", "gpui-neath/tree-sitter-java"]
tree-sitter-javascript = ["component", "gpui-neath/tree-sitter-javascript"]
tree-sitter-jsdoc = ["component", "gpui-neath/tree-sitter-jsdoc"]
tree-sitter-kotlin = ["component", "gpui-neath/tree-sitter-kotlin"]
tree-sitter-lua = ["component", "gpui-neath/tree-sitter-lua"]
tree-sitter-make = ["component", "gpui-neath/tree-sitter-make"]
tree-sitter-markdown = ["component", "gpui-neath/tree-sitter-markdown"]
tree-sitter-markdown-inline = ["component", "gpui-neath/tree-sitter-markdown-inline"]
tree-sitter-php = ["component", "gpui-neath/tree-sitter-php"]
tree-sitter-proto = ["component", "gpui-neath/tree-sitter-proto"]
tree-sitter-python = ["component", "gpui-neath/tree-sitter-python"]
tree-sitter-ruby = ["component", "gpui-neath/tree-sitter-ruby"]
tree-sitter-rust = ["component", "gpui-neath/tree-sitter-rust"]
tree-sitter-scala = ["component", "gpui-neath/tree-sitter-scala"]
tree-sitter-sql = ["component", "gpui-neath/tree-sitter-sql"]
tree-sitter-svelte = ["component", "gpui-neath/tree-sitter-svelte"]
tree-sitter-swift = ["component", "gpui-neath/tree-sitter-swift"]
tree-sitter-toml = ["component", "gpui-neath/tree-sitter-toml"]
tree-sitter-tsx = ["component", "gpui-neath/tree-sitter-tsx"]
tree-sitter-typescript = ["component", "gpui-neath/tree-sitter-typescript"]
tree-sitter-yaml = ["component", "gpui-neath/tree-sitter-yaml"]
tree-sitter-zig = ["component", "gpui-neath/tree-sitter-zig"]

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-neath = { workspace = true, optional = true }
gpui-component-assets = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true

[dev-dependencies]
chrono = "0.4.38"
gpui = { workspace = true, features = ["test-support"] }
lsp-types.workspace = true

[[test]]
name = "window"
required-features = ["test-support"]

[[test]]
name = "lifecycle"
required-features = ["test-support"]

[[test]]
name = "components"
required-features = ["test-support", "component"]

[[test]]
name = "input"
required-features = ["test-support", "component"]

[[test]]
name = "input_focus"
required-features = ["test-support", "component"]

[[test]]
name = "ui"
required-features = ["test-support", "component"]

[[test]]
name = "root"
required-features = ["test-support", "component"]

[[test]]
name = "controls"
required-features = ["test-support", "component"]

[[test]]
name = "interactions"
required-features = ["test-support"]

[[test]]
name = "rendering"
# Requires a real Metal device; select explicitly with --test rendering.
test = false
harness = false
required-features = ["test-support", "component", "assets"]

[[test]]
name = "disclosure"
required-features = ["test-support", "component"]

[[test]]
name = "overlays"
required-features = ["test-support", "component"]

[[test]]
name = "breadcrumb"
required-features = ["test-support", "component"]

[[test]]
name = "menu"
required-features = ["test-support", "component"]

[[test]]
name = "collections"
required-features = ["test-support", "component"]

[[test]]
name = "date_picker"
required-features = ["test-support", "component"]

[[test]]
name = "dock"
required-features = ["test-support", "component"]

[[test]]
name = "search"
required-features = ["assets", "test-support", "component"]

[[test]]
name = "touch_selection"
required-features = ["test-support", "component"]
