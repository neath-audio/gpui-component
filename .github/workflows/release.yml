name: "Release Crate"
on:
  push:
    tags:
      - "v*"
jobs:
  publish_crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Release Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # gpui-base and gpui-neath are fork-private (`publish = false`).
          cargo publish -p gpui-component-assets
          cargo publish -p gpui-component-macros
          cargo publish -p gpui-wry
